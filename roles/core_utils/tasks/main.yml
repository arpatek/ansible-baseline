# ┌────────────────────────────────────────────────────┐
# │ Role: core_utils                                   │
# │ Installs basic CLI tools and drops dotfiles        │
# │ (.vimrc and .gitconfig) into the target home dir.  │
# └────────────────────────────────────────────────────┘

- name: Install core utils
  ansible.builtin.apt:
    name: "{{ core_utils_packages }}"
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"
  tags: [install, tools, core]

- name: Copy .vimrc to user's home directory
  ansible.builtin.copy:
    src: files/vimrc
    dest: /home/{{ ansible_user }}/.vimrc
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  tags: [dotfiles, core]

- name: Copy .gitconfig to user's home directory
  ansible.builtin.copy:
    src: files/gitconfig
    dest: /home/{{ ansible_user }}/.gitconfig
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  tags: [dotfiles, core]
