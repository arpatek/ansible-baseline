# ┌────────────────────────────────────────────────────────────────────┐
# │ (SSH HANDLERS)                                                     │
# │ Handlers triggered by SSH config changes.                          │
# │ - Log hardening event                                              │
# │ - Restart sshd service                                             │
# │ - Confirm restart completed                                        │
# └────────────────────────────────────────────────────────────────────┘

- name: Hardening SSH
  ansible.builtin.debug:
    msg: "Restarting SSH due to config change..."

- name: Restart SSH
  ansible.builtin.service:
    name: ssh
    state: restarted

- name: Confirm SSH
  ansible.builtin.debug:
    msg: "SSH restarted successfully. Hardened config confirmed."
